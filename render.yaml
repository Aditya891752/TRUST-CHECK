services:
  - type: web
    name: trustcheck-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: DAILY_REQUEST_CAP
        value: 1000
